[project]
name = "undercover"
version = "0.1.0"
description = "UnderCover Travel Insurance claims automation"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "langchain>=1.5.2",
    "langchain-openai>=1.8.5",
    "nbformat>=5.11.1",
    "openai>=3.57.0",
    "openrouter>=1.3.204",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

[tool.ruff]
include = ["backend/**/*.py", "agent/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM", "UP", "PL", "S", "PT", "FAST", "C90", "PLR1702"]
preview = true
explicit-preview-rules = true

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["S101", "PLR2004"]

[tool.pytest.ini_options]
testpaths = ["backend", "agent"]
pythonpath = ["."]
addopts = "--import-mode=importlib --cov --cov-report=term-missing"

[tool.coverage.run]
source = ["backend", "agent"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 80

[tool.pyright]
include = ["backend", "agent"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
